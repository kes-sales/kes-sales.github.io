<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KES Daily Sales Report</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="text-center py-4">
            <h1 class="app-title">KES Daily Sales Report</h1>
            <p class="app-subtitle">Submit your daily activities</p>
        </header>

        <form id="salesForm">
            <!-- Employee Information -->
            <div class="card mb-4">
                <div class="card-body">
                    <h2 class="card-title mb-4">Employee Information</h2>
                    
                    <div class="mb-3">
                        <label for="employeeName" class="form-label required">Employee Name</label>
                        <input type="text" class="form-control" id="employeeName" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="reportDate" class="form-label required">Date</label>
                        <input type="date" class="form-control" id="reportDate" required>
                    </div>
                </div>
            </div>

            <!-- Activities Section -->
            <div class="mb-4">
                <h2 class="section-title mb-3">Activities</h2>
                <div id="activitiesContainer">
                    <!-- Activity cards will be dynamically added here -->
                </div>
            </div>

            <!-- Add Activity Button -->
            <div class="text-center mb-4">
                <button type="button" class="btn btn-sm btn-add-activity" id="addActivityBtn">
                    <span class="btn-icon">+</span> Add Another Activity
                </button>
            </div>

            <!-- Submit Button -->
            <div class="text-center mb-4">
                <button type="submit" class="btn btn-submit" id="submitBtn">
                    Submit Report
                </button>
            </div>

            <!-- Loading Indicator -->
            <div class="text-center mb-4" id="loadingIndicator" style="display: none;">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-2 text-muted">Submitting your report...</p>
            </div>

            <!-- Success/Error Messages -->
            <div class="alert alert-success" id="successMessage" style="display: none;">
                <strong>Success!</strong> Your report has been submitted successfully.
            </div>
            
            <div class="alert alert-danger" id="errorMessage" style="display: none;">
                <strong>Error!</strong> <span id="errorText">There was a problem submitting your report. Please try again.</span>
            </div>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
